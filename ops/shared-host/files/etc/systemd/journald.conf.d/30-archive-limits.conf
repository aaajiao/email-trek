# Bounded journal storage for this small archival host.
# Applies on the already scheduled host reboot; no extra daemon restart needed.
[Journal]
RuntimeMaxUse=32M
RuntimeKeepFree=32M
RuntimeMaxFileSize=4M
SystemMaxUse=128M
SystemKeepFree=256M
SystemMaxFileSize=16M
MaxFileSec=1day
MaxRetentionSec=7day
