server {
    listen 80;
    listen [::]:80;
    server_name bot-gluttony.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bot-gluttony.com;
    ssl_certificate /etc/letsencrypt/live/archive-projects/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archive-projects/privkey.pem;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ArchiveSSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    # BEGIN managed archive POST edge limits
    location = /api/auth/login {
        client_max_body_size 8k;
        limit_req zone=archive_bot_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $archive_connection_upgrade;
        proxy_read_timeout 3600s;
    }
    # END managed archive POST edge limits
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $archive_connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
